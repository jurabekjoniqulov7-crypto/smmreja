html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}

.wrap{max-width:720px;margin:0 auto;padding:14px 14px 80px}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0}

.strip button.p{background:var(--warn);color:#000;border-color:var(--warn)}
.strip button.d{background:var(--ok);color:#fff;border-color:var(--ok)}
.strip button.c{outline:2px solid var(--acc);outline-offset:1px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav button,.btn{font:inherit;font-weight:700;font-size:.9rem;border-radius:9px;padding:8px 14px;cursor:pointer;border:1px solid var(--acc);background:var(--acc);color:#fff}
.btn.g{background:none;color:var(--mute);border-color:var(--line)}
.btn.ok{background:var(--ok);border-color:var(--ok)}
label.t{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
label.t:last-child{border-bottom:0}
label.t input{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;margin:1px 0 0;border:2px solid var(--mute);border-radius:7px;display:grid;place-content:center;cursor:pointer;background:var(--card)}
label.t input:checked{background:var(--ok);border-color:var(--ok)}
label.t input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
label.t input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
label.t input:checked+span{color:var(--mute);text-decoration:line-through}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.nums label{font-size:.8rem;color:var(--mute);font-weight:600}
input[type=number],input[type=text],input[type=date],select{width:100%;font:inherit;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.big{font-size:1.7rem;font-weight:800}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lead{display:grid;grid-template-columns:1fr 130px auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.lead small{display:block;color:var(--mute);word-break:break-all}
.tpl p{white-space:pre-wrap;margin:4px 0 10px;font-size:.92rem;color:var(--mute)}
</style>
</head>
